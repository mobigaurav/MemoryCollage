[project]
name = "memory-book-api"
version = "0.1.0"
description = "Memory Book accounts, credits, and image-to-video jobs."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "mangum>=0.17",
  "uvicorn>=0.30",
  "python-jose[cryptography]>=3.3",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mb_api"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
