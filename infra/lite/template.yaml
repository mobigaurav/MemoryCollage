# Memory Book lite stack. Own Cognito pool. Do not point this at Arogya.
#
#   cd infra/lite && sam build && sam deploy --guided
#
# First deploy needs Docker (the API is a container image) and an AWS
# account in us-east-1. Neon and the video vendor key can wait.

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Memory Book lite — Cognito + API + private media bucket

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
  AppName:
    Type: String
    Default: memorybook
  CorsOrigins:
    Type: String
    Default: "*"
  VideoVendor:
    Type: String
    Default: none
    Description: none until a vendor key exists. Then luma, runway, or kling.
  VideoVendorApiKey:
    Type: String
    Default: ""
    NoEcho: true

Globals:
  Function:
    Timeout: 29
    MemorySize: 512
    Architectures: [arm64]

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AppName}-${Env}-users"
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      MfaConfiguration: "OFF"
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      Schema:
        - { Name: email, AttributeDataType: String, Required: true, Mutable: true }
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AppName}-${Env}-app"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 24
      IdTokenValidity: 24
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AppName}-${Env}-media-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-uploads
            Status: Enabled
            ExpirationInDays: 7
            Prefix: uploads/

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-${Env}-api"
      PackageType: Image
      Environment:
        Variables:
          ENV: !Ref Env
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_APP_CLIENT_ID: !Ref UserPoolClient
          MEDIA_BUCKET: !Ref MediaBucket
          CORS_ORIGINS: !Ref CorsOrigins
          VIDEO_VENDOR: !Ref VideoVendor
          VIDEO_VENDOR_API_KEY: !Ref VideoVendorApiKey
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref MediaBucket
      Events:
        ProxyApi:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
            RestApiId: !Ref RestApi
        RootApi:
          Type: Api
          Properties:
            Path: /
            Method: ANY
            RestApiId: !Ref RestApi
    Metadata:
      Dockerfile: services/api/Dockerfile
      DockerContext: ../..
      DockerTag: !Sub "${Env}"

  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AppName}-${Env}-api"
      StageName: !Ref Env
      EndpointConfiguration:
        Type: REGIONAL
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'*'"
        AllowOrigin: "'*'"

Outputs:
  ApiUrl:
    Description: Pass this as AI_BASE_URL. No trailing slash.
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${Env}"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Pass this as COGNITO_CLIENT_ID
    Value: !Ref UserPoolClient
  MediaBucketName:
    Value: !Ref MediaBucket
