version = 0.1

[default.global.parameters]
stack_name = "memorybook-lite-dev"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
resolve_image_repos = true
region = "us-east-1"
parameter_overrides = "Env=dev AppName=memorybook VideoVendor=none"
