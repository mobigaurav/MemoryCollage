name: Feature request
description: New screen, capability, endpoint or change
labels: ["type:feature", "agent:proposed"]
body:
  - type: textarea
    id: request
    attributes: {label: Request, description: "What do you want, in your own words?"}
    validations: {required: true}
  - type: textarea
    id: why
    attributes: {label: Why it matters, description: "Who uses it and what problem it solves?"}
  - type: textarea
    id: acceptance
    attributes: {label: Acceptance criteria, value: "- [ ] "}
  - type: input
    id: requester
    attributes: {label: Requested by, description: "Name / team"}
