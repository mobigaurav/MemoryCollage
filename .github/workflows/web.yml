# Deploys the Memory Book marketing site when `dev` is updated.
# VERCEL_TOKEN is required. Optional: VERCEL_ORG_ID (team scope).
#
# Do not set VERCEL_PROJECT_ID to Arogya's `web` project. `vercel --yes`
# from a folder named `apps/web` will otherwise link to that existing
# project and steal https://web-liart-six-83.vercel.app.

name: web

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Deploy apps/web to Vercel
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not set on this repo. Skipping the site deploy."
            exit 0
          fi
          npm install --global vercel@latest
          # Ignore a copied Arogya project id if one is still on this repo.
          unset VERCEL_PROJECT_ID
          args=(deploy --prod --yes --name memory-book --token "$VERCEL_TOKEN")
          if [ -n "$VERCEL_ORG_ID" ]; then
            args+=(--scope "$VERCEL_ORG_ID")
          fi
          vercel "${args[@]}"
