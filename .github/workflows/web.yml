# Deploys the Memory Book site when `main` is updated.
# A merge into `dev` does not deploy. VERCEL_TOKEN is required.
# Optional: VERCEL_ORG_ID (team scope).
#
# The public site is https://memory-book-pearl-zeta.vercel.app
# on Vercel project `memory-book`.
#
# Do not set VERCEL_PROJECT_ID. A folder named apps/web plus `vercel --yes`
# will attach to an existing project named `web` and take over that site.
# This job links only to the project named memory-book, then refuses to
# continue if the linked name is anything else.

name: web

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_refs:
        description: Comma-separated branches to rebuild after the project root is apps/web
        required: false
        default: ""

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Deploy apps/web to the Memory Book Vercel project
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PREVIEW_REFS: ${{ inputs.preview_refs }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not set on this repo. Skipping the site deploy."
            exit 0
          fi
          qs=""
          if [ -n "${VERCEL_ORG_ID:-}" ]; then
            qs="?teamId=${VERCEL_ORG_ID}"
          fi
          code=$(curl -sS -o /tmp/vercel-project.json -w "%{http_code}" -X PATCH \
            "https://api.vercel.com/v9/projects/memory-book${qs}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"rootDirectory":"apps/web"}')
          node -e '
            const fs = require("fs");
            const code = process.argv[1];
            const j = JSON.parse(fs.readFileSync("/tmp/vercel-project.json", "utf8"));
            if (code !== "200" && code !== "201") {
              const message = j.error && j.error.message ? j.error.message : "no message";
              console.error("Could not set the project root. HTTP " + code + ": " + message);
              process.exit(1);
            }
            if (j.name !== "memory-book" || j.rootDirectory !== "apps/web") {
              console.error("Refusing project " + j.name + " at " + j.rootDirectory);
              process.exit(1);
            }
            console.log("memory-book rootDirectory=apps/web");
          ' "$code"
          rm -f /tmp/vercel-project.json
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${PREVIEW_REFS:-}" ]; then
            repo_id="${{ github.event.repository.id }}"
            IFS=',' read -ra refs <<< "$PREVIEW_REFS"
            for ref in "${refs[@]}"; do
              ref="$(printf '%s' "$ref" | tr -d '[:space:]')"
              [ -z "$ref" ] && continue
              git fetch origin "$ref"
              sha="$(git rev-parse "origin/$ref")"
              payload="$(node -e 'console.log(JSON.stringify({name:"memory-book",project:"memory-book",gitSource:{type:"github",repoId:Number(process.argv[1]),ref:process.argv[2],sha:process.argv[3]}}))' "$repo_id" "$ref" "$sha")"
              dcode=$(curl -sS -o /tmp/vercel-deploy.json -w "%{http_code}" -X POST \
                "https://api.vercel.com/v13/deployments${qs}" \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$payload")
              node -e '
                const fs = require("fs");
                const code = process.argv[1];
                const j = JSON.parse(fs.readFileSync("/tmp/vercel-deploy.json", "utf8"));
                if (code !== "200" && code !== "201") {
                  const message = j.error && j.error.message ? j.error.message : "no message";
                  console.error("Could not rebuild " + process.argv[2] + ". HTTP " + code + ": " + message);
                  process.exit(1);
                }
                console.log("rebuilding " + process.argv[2] + " " + (j.url || j.id || ""));
              ' "$dcode" "$ref"
              rm -f /tmp/vercel-deploy.json
            done
          fi
          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "Project root is set. Production deploy runs only from main."
            exit 0
          fi
          npm install --global vercel@latest
          unset VERCEL_PROJECT_ID
          scope=()
          if [ -n "${VERCEL_ORG_ID:-}" ]; then
            scope=(--scope "$VERCEL_ORG_ID" --team "$VERCEL_ORG_ID")
          fi
          vercel link --yes --project memory-book "${scope[@]}" --token "$VERCEL_TOKEN"
          name=$(vercel project inspect memory-book "${scope[@]}" --token "$VERCEL_TOKEN" --format json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const j=JSON.parse(s); if(j.name!=='memory-book'){console.error('Refusing project '+j.name); process.exit(1)} console.log(j.name)})")
          echo "Linked project: $name"
          log=$(vercel deploy --prod --yes "${scope[@]}" --token "$VERCEL_TOKEN")
          printf '%s\n' "$log"
          if printf '%s\n' "$log" | grep -Eiq 'web-liart-six|arogya|health-twin|/web[^-]'; then
            echo "Refusing to publish onto another product."
            exit 1
          fi
          if ! printf '%s\n' "$log" | grep -q 'memory-book'; then
            echo "Deploy did not stay on the memory-book project."
            exit 1
          fi
